# 200-query routing benchmark fixture.
#
# Composition (frozen per DESIGN.md §2.3):
#   - 90 k=1 queries (single gold)
#   - 45 k=2 queries (two golds)
#   - 15 k=3 queries (three golds)
#   - 50 null queries (25 small-talk + 15 dev-trap + 10 adversarial)
#
# Length policy (enforced by scripts/check_query_lengths.py):
#   - 30% short (≤40 chars), 50% medium (41-140), 20% long (141-400)
#   - hard ceiling: 400 chars
#
# Authoring rules (enforced by scripts/check_query_authorship.py +
# scripts/check_gold_coverage.py):
#   - all queries in English
#   - natural user phrasing, not skill-description verbatim
#   - no ≥20-char substring from any SKILL.md *body* (frontmatter exempt)
#   - every G01..G59 appears in 1-5 in-dist queries
#   - null queries reference zero golds
#
# Schema:
#   id: q001..q200 (zero-padded, fixed width)
#   query: natural user input string
#   golds: list of gold_id; empty [] for null
#   length_bucket: short | medium | long
#   null_kind: null | small_talk | dev_trap | adversarial

