[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mega-tron"
version = "1.0.0"
description = "Self-improving skill routing for Codex / Claude Code / Gemini CLIs — solves the 2% / 1% skill catalog cap with semantic top-K injection, session-end self-evaluation, and evidence-blended re-ranking."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "gwanghoon", email = "gwanghoon@megacode.ai" }]
keywords = ["codex", "claude-code", "anthropic", "openai", "skills", "router", "embeddings", "agentic", "retrieval"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
tokens = ["tiktoken>=0.8.0"]
openai = ["openai>=1.40.0"]
voyage = ["voyageai>=0.3.0"]
multilingual = ["sentence-transformers>=3.0.0"]  # BGE-m3 ships with this dep already
agentic-litellm = ["litellm>=1.50.0"]  # v0.5 BYOK backend for AgenticSearch

[project.scripts]
mega-tron = "mega_tron.cli:main"

# [project.urls] intentionally omitted until the repository has a published home.

# PEP 735 — used by `uv sync` / `uv run`. Pip ≥ 25 also reads this.
[dependency-groups]
bench = [
    "datasets>=4.8.5",
    "litellm>=1.84.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "tiktoken>=0.8.0",
]

[tool.uv]
# Install the project itself into the env when running `uv sync`.
package = true
# Make `uv sync` install dev deps by default — opt out with `uv sync --no-dev`.
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/mega_tron"]

[tool.hatch.build.targets.wheel.force-include]
"src/mega_tron/hosts/codex/templates" = "mega_tron/hosts/codex/templates"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
