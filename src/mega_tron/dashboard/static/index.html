<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mega-tron dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="root">
    <header class="topbar">
      <div class="topbar-brand">
        <a class="brand-logo" href="https://www.megacode.ai/" target="_blank" rel="noopener noreferrer"
           title="Open megacode.ai">
          <img src="/static/logo_mega_code.png" alt="mega-code" width="28" height="28" />
        </a>
        <h1>mega-tron dashboard</h1>
      </div>
      <span id="connection" class="connection">connecting…</span>
    </header>

    <section id="overview-card" class="card">
      <div class="card-title">Skills overview</div>
      <div id="skill-bar" class="stacked-bar static" role="img"
           aria-label="Used vs unused skills"></div>
      <div id="skill-summary" class="summary"></div>
      <div class="card-title">Hosts</div>
      <div id="host-chips" class="chips"></div>
      <div class="card-title">Activity</div>
      <div id="activity-row">
        <svg id="activity-sparkline" viewBox="0 0 300 32" preserveAspectRatio="none"></svg>
        <div id="time-toggle" class="toggle" role="tablist"></div>
      </div>
      <div class="card-title">Health</div>
      <div id="health-row"></div>
    </section>

    <section id="verdicts-card" class="card">
      <div class="card-title row">
        <span id="list-mode-title">Skills with verdicts</span>
        <span class="list-mode-toggle">
          <button class="ghost-btn active" data-list-mode="skills" type="button">By skill</button>
          <button class="ghost-btn" data-list-mode="verdicts" type="button">Recent verdicts</button>
          <input id="search-input" class="search" type="search"
                 placeholder="search reasons…" aria-label="search verdict reasons">
        </span>
      </div>
      <ul id="verdicts-list" class="verdicts-list"></ul>
    </section>

    <div id="pane-rail" class="pane-rail" aria-label="Detail panes"></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
