<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mega-tron dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="root">
    <header class="topbar">
      <div class="topbar-brand">
        <a class="brand-logo" href="https://www.megacode.ai/" target="_blank" rel="noopener noreferrer"
           title="Open megacode.ai">
          <img src="/static/logo_mega_code.png" alt="mega-code" width="28" height="28" />
        </a>
        <h1>mega-tron dashboard</h1>
      </div>
      <span id="connection" class="connection">connecting…</span>
    </header>

    <nav class="tab-strip" role="tablist" aria-label="Dashboard sections">
      <button class="tab-btn active" data-tab="overview" type="button" role="tab"
              aria-controls="tab-panel-overview" aria-selected="true">
        Skills overview
      </button>
      <button class="tab-btn" data-tab="review" type="button" role="tab"
              aria-controls="tab-panel-review" aria-selected="false">
        Review
      </button>
    </nav>

    <!-- Tab 1 — Skills overview (observability) -->
    <section id="tab-panel-overview" class="tab-panel" data-tab-panel="overview"
             role="tabpanel" aria-labelledby="Skills overview">
      <div id="big-numbers" class="big-numbers"></div>

      <section class="card">
        <div class="card-title">Verdict Hosts</div>
        <div id="host-bars" class="host-bars" role="img"
             aria-label="Skill counts per host that recorded a verdict"></div>
      </section>

      <div class="skill-cards-row">
        <section class="card skill-list-card">
          <div class="card-title" id="active-skills-title">Active skills</div>
          <div class="card-sub">Sorted by most recent verdict.</div>
          <ul id="active-skills-list" class="active-skills-list"></ul>
          <nav id="active-skills-pager" class="pager" hidden></nav>
        </section>
        <section class="card skill-list-card">
          <div class="card-title" id="helpful-skills-title">Most helpful skills</div>
          <div class="card-sub">Sorted by net helpful − harmful.</div>
          <ul id="helpful-skills-list" class="active-skills-list"></ul>
          <nav id="helpful-skills-pager" class="pager" hidden></nav>
        </section>
      </div>
    </section>

    <!-- Tab 2 — Review (HITL verdict cleanup) -->
    <section id="tab-panel-review" class="tab-panel" data-tab-panel="review"
             role="tabpanel" aria-labelledby="Review" hidden>
      <!-- Top bar combines the health warnings (when any) with the
           multi-category filter. Default state shows just the filter
           — no chatty "all clear" sentence. -->
      <div class="review-toolbar">
        <div id="health-row" class="health-row"></div>
        <div class="review-filter">
          <label class="review-filter-label" for="filter-field">Filter by</label>
          <select id="filter-field" class="review-filter-field">
            <option value="title">title</option>
            <option value="description">description</option>
            <option value="hosts">hosts</option>
          </select>
          <input id="filter-text" class="review-filter-input" type="search"
                 placeholder="match by skill name…"
                 aria-label="filter value">
          <select id="filter-host" class="review-filter-host" hidden
                  aria-label="filter by host">
            <option value="">all hosts</option>
            <option value="codex">codex</option>
            <option value="claude">claude</option>
            <option value="gemini">gemini</option>
            <option value="user">user</option>
          </select>
          <button id="filter-clear" class="ghost-btn" type="button" hidden>clear</button>
        </div>
      </div>

      <section id="verdicts-card" class="card">
        <div class="card-title row">
          <span id="list-mode-title">Skills with verdicts</span>
          <span class="list-mode-toggle">
            <button class="ghost-btn active" data-list-mode="skills" type="button">By skill</button>
            <button class="ghost-btn" data-list-mode="verdicts" type="button">Recent verdicts</button>
          </span>
        </div>
        <ul id="verdicts-list" class="verdicts-list"></ul>
        <nav id="review-pager" class="pager" hidden></nav>
      </section>

      <div id="pane-rail" class="pane-rail" aria-label="Detail panes"></div>
    </section>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
